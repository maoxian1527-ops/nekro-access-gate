name: Bug 报告
description: 插件没按预期工作
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: "`docker logs <容器> --since 10m | grep -E 'access_gate|门禁'` 的输出（请删掉自己的 QQ 号/群号）"
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NekroAgent 版本 & 插件版本
      placeholder: "NekroAgent 2.4.0 / access-gate 0.1.0"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 自检
      options:
        - label: 已确认插件出现在 configs/nekro-agent.yaml 的 PLUGIN_ENABLED 里
          required: true
        - label: 已访问 /plugins/<author>.access_gate/status 确认路由存在
          required: false